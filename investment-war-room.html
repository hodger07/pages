<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#050508;--card:#0a0a10;--card-border:#1a1a2e;--text:#e0e0e8;--text-dim:#8888a0;--text-bright:#ffffff}
html{font-size:14px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* TICKER */
.ticker-wrap{background:#08080f;border-bottom:1px solid #1a1a2e;overflow:hidden;white-space:nowrap;height:36px;display:flex;align-items:center;position:sticky;top:0;z-index:100}
.ticker-track{display:inline-block;animation:tickerScroll 45s linear infinite;white-space:nowrap}
.ticker-track:hover{animation-play-state:paused}
@keyframes tickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-item{display:inline-block;padding:0 24px;font-size:0.78rem;font-weight:600;letter-spacing:0.5px}
.ticker-up{color:#22c55e}.ticker-down{color:#ef4444}.ticker-warn{color:#f59e0b}.ticker-neutral{color:#94a3b8}

/* HEADER */
.header{text-align:center;padding:28px 20px 18px;border-bottom:1px solid #1a1a2e;background:linear-gradient(180deg,#0a0a14 0%,#050508 100%)}
.header-top{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px}
.live-dot{width:10px;height:10px;border-radius:50%;background:#ef4444;animation:livePulse 1.5s ease-in-out infinite;box-shadow:0 0 8px #ef4444}
@keyframes livePulse{0%,100%{opacity:1;box-shadow:0 0 8px #ef4444}50%{opacity:0.3;box-shadow:0 0 2px #ef4444}}
.header h1{font-size:1.8rem;font-weight:900;letter-spacing:8px;color:#fff;text-transform:uppercase}
.header .subtitle{font-size:0.78rem;color:var(--text-dim);letter-spacing:1.5px;margin-top:4px}
.header .date{font-size:0.72rem;color:#666;margin-top:4px;letter-spacing:1px}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:16px;max-width:1600px;margin:0 auto}
@media(max-width:1200px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr;gap:10px;padding:10px}}

/* CARD */
.card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:16px;transition:all 0.5s ease;position:relative;overflow:hidden}
.card.active{opacity:1!important;transform:translateY(-3px);z-index:10}
.card.inactive{opacity:0.6}
.card:hover{opacity:0.9!important}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.72rem;color:#fff;flex-shrink:0;letter-spacing:1px}
.card-name{font-weight:700;font-size:0.88rem;color:#fff}
.card-title{font-size:0.68rem;color:var(--text-dim);margin-top:1px}
.tagline{font-size:0.72rem;color:var(--text-dim);font-style:italic;margin-bottom:10px;line-height:1.4;min-height:32px}

/* SPEECH BUBBLE */
.speech{background:#0f0f1a;border:1px solid #1e1e35;border-radius:8px;padding:12px;margin-bottom:12px;min-height:90px;position:relative;transition:border-color 0.5s}
.speech-text{font-size:0.78rem;line-height:1.55;color:var(--text);opacity:1;transition:opacity 0.4s}
.speech-text.fading{opacity:0}

/* ALLOCATION TABLE */
.alloc-table{width:100%;margin-bottom:10px}
.alloc-table td{font-size:0.7rem;padding:2px 0;vertical-align:middle}
.alloc-table .alloc-asset{color:var(--text-dim);width:40%}
.alloc-table .alloc-pct{color:#fff;font-weight:600;width:20%;text-align:right}
.alloc-table .alloc-amt{color:var(--text-dim);width:40%;text-align:right;font-size:0.65rem}

/* CONFIDENCE BAR */
.conf-wrap{margin-top:6px}
.conf-label{font-size:0.65rem;color:var(--text-dim);margin-bottom:3px;display:flex;justify-content:space-between}
.conf-bar-bg{height:4px;background:#1a1a2e;border-radius:2px;overflow:hidden}
.conf-bar{height:100%;border-radius:2px;transition:width 1s ease}

/* CONSENSUS PANEL */
.consensus{max-width:1600px;margin:0 auto;padding:0 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.consensus{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:20px}
.panel-title{font-size:0.85rem;font-weight:700;color:#fff;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
.alloc-bar-wrap{margin-bottom:10px}
.alloc-bar-label{display:flex;justify-content:space-between;font-size:0.75rem;margin-bottom:4px}
.alloc-bar-label span:first-child{color:var(--text)}
.alloc-bar-label span:last-child{color:var(--text-dim)}
.alloc-bar-outer{height:22px;background:#1a1a2e;border-radius:4px;overflow:hidden}
.alloc-bar-inner{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:0.7rem;font-weight:700;color:#fff;transition:width 1.5s ease}

/* VOTE */
.vote-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:0.78rem;border-bottom:1px solid #111}
.vote-row:last-child{border:none}
.vote-name{width:180px;color:var(--text-dim)}
.vote-pick{font-weight:700;color:#fff}
.vote-tally{margin-top:14px;padding:12px;background:#0f0f1a;border-radius:8px;font-size:0.8rem;line-height:1.6}
.vote-tally strong{color:#f59e0b}
.vote-consensus{margin-top:10px;font-size:0.72rem;color:var(--text-dim);line-height:1.5;border-top:1px solid #1e1e35;padding-top:10px}

/* DEBATE LOG */
.log-wrap{max-width:1600px;margin:0 auto;padding:0 16px 20px}
.log-panel{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:16px}
.log-title{font-size:0.85rem;font-weight:700;color:#fff;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.log-scroll{height:200px;overflow-y:auto;font-family:'Inter',monospace;font-size:0.72rem;line-height:1.6}
.log-scroll::-webkit-scrollbar{width:4px}
.log-scroll::-webkit-scrollbar-track{background:#0a0a10}
.log-scroll::-webkit-scrollbar-thumb{background:#2a2a3e;border-radius:2px}
.log-entry{padding:2px 0;color:var(--text-dim)}
.log-entry .log-time{color:#555}
.log-entry .log-name{font-weight:700}
</style>
</head>

// Add log entry
function addLog(invIdx, text){
  debateTime = new Date(debateTime.getTime() + Math.floor(Math.random()*40000+20000));
  const h = String(debateTime.getHours()).padStart(2,'0');
  const m = String(debateTime.getMinutes()).padStart(2,'0');
  const s = String(debateTime.getSeconds()).padStart(2,'0');
  const inv = investors[invIdx];
  const short = text.length > 90 ? text.substring(0,90) + '\u2026' : text;
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `<span class="log-time">[${h}:${m}:${s}]</span> <span class="log-name" style="color:${inv.color}">${inv.name.toUpperCase()}:</span> ${short}`;
  logEl.appendChild(entry);
  logEl.scrollTop = logEl.scrollHeight;
}

// Activate a speaker
function activateSpeaker(invIdx, stIdx){
  const inv = investors[invIdx];
  const text = inv.statements[stIdx];

  // Dim all cards
  investors.forEach((_,i) => {
    const card = document.getElementById('card-'+i);
    card.classList.remove('active');
    card.classList.add('inactive');
    card.style.boxShadow = 'none';
    card.style.borderColor = investors[i].color+'22';
    const topBar = card.querySelector('.top-bar');
    if(topBar) topBar.style.opacity = '0.4';
  });

  // Activate current speaker
  const card = document.getElementById('card-'+invIdx);
  card.classList.remove('inactive');
  card.classList.add('active');
  card.style.boxShadow = `0 0 25px ${inv.color}40, 0 8px 32px rgba(0,0,0,0.6)`;
  card.style.borderColor = inv.color+'88';
  const topBar = card.querySelector('.top-bar');
  if(topBar) topBar.style.opacity = '1';

  // Fade text transition
  const textEl = document.getElementById('text-'+invIdx);
  textEl.classList.add('fading');
  setTimeout(() => {
    textEl.textContent = '\u201C' + text + '\u201D';
    textEl.classList.remove('fading');
  }, 350);

  // Update speech border
  document.getElementById('speech-'+invIdx).style.borderColor = inv.color+'66';

  addLog(invIdx, text);
}

    document.getElementById('text-'+e.inv).textContent = '\u201C' + investors[e.inv].statements[e.st] + '\u201D';
  });
  currentStep = 0; // start debate from beginning — pre-pop is just visual seed
}

// Conclude the debate — moderator calls it
function concludeDebate(){
  // Dim all cards
  investors.forEach((_,i) => {
    const card = document.getElementById('card-'+i);
    card.classList.remove('active');
    card.classList.add('inactive');
    card.style.boxShadow = 'none';
    card.style.borderColor = investors[i].color+'11';
    card.style.opacity = '0.35';
  });

  // Kill live dot
  document.querySelectorAll('.live-dot').forEach(d => {
    d.style.animation = 'none';
    d.style.background = '#555';
    d.style.boxShadow = 'none';
  });

  // Update header
  const subtitle = document.querySelector('.header .subtitle');
  subtitle.textContent = 'DEBATE CONCLUDED — VERDICT REACHED';
  subtitle.style.color = '#f59e0b';
  subtitle.style.letterSpacing = '3px';

  // Add final log entry
  const finalEntry = document.createElement('div');
  finalEntry.style.cssText = 'padding:8px 0;color:#f59e0b;font-weight:700;font-size:0.78rem;border-top:1px solid #2a2a1a;margin-top:6px';
  finalEntry.textContent = '⚖ MODERATOR: The panel has spoken. Scroll to BATTLE VERDICTS for the final call.';
  logEl.appendChild(finalEntry);
  logEl.scrollTop = logEl.scrollHeight;

  // Flash the verdict section
  const verdictGrid = document.getElementById('verdictGrid');
  const lastVerdict = verdictGrid.lastElementChild;
  if(lastVerdict){
    lastVerdict.style.transition = 'box-shadow 1s ease, border-color 1s ease';
    lastVerdict.style.borderColor = '#3B82F6';
    lastVerdict.style.boxShadow = '0 0 40px #3B82F660';
    // Scroll to it
    setTimeout(() => lastVerdict.scrollIntoView({behavior:'smooth', block:'center'}), 800);
  }
}

// Main debate loop — runs ONCE through all steps, then concludes
function runDebate(){
  if(currentStep >= debateOrder.length){
    concludeDebate();
    return; // STOP. No loop, no reset.
  }
  const step = debateOrder[currentStep];
  activateSpeaker(step.inv, step.st);
  currentStep++;
  const delay = 8000 + Math.random()*3000; // 8-11 seconds
  setTimeout(runDebate, delay);
}
